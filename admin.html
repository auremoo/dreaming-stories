<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administration — Dreaming Stories</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/jpeg" href="assets/icon.jpg">
  <link rel="apple-touch-icon" href="assets/icon.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Lora:ital@0;1&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="admin-body">
  <canvas id="stars" aria-hidden="true"></canvas>

  <!-- Password Gate -->
  <div id="password-gate" class="password-gate" role="dialog" aria-modal="true" aria-label="Connexion admin">
    <div class="password-card">
      <img src="assets/icon.jpg" alt="" class="password-card-img">
      <h2>Administration</h2>
      <p>Entrez le mot de passe pour accéder à la gestion des histoires.</p>
      <input
        type="password"
        id="password-input"
        class="input-field center"
        placeholder="••••••"
        autocomplete="current-password"
        aria-label="Mot de passe"
        style="margin-bottom:12px"
      >
      <button class="btn btn-primary" id="login-btn" style="width:100%">Connexion</button>
    </div>
  </div>

  <!-- Admin App -->
  <div id="admin-content">
    <div class="app">
      <!-- Sidebar (desktop) -->
      <aside class="sidebar" role="navigation" aria-label="Navigation admin">
        <div class="sidebar-logo">
          <img src="assets/icon.jpg" alt="" class="sidebar-logo-img" aria-hidden="true">
          <span class="sidebar-logo-text">Dreaming Stories</span>
        </div>

        <span class="sidebar-section">Navigation</span>
        <a href="index.html" class="sidebar-link">
          <span class="link-icon">🌙</span> Voir le site
        </a>

        <span class="sidebar-section">Admin</span>
        <a href="admin.html" class="sidebar-link active">
          <span class="link-icon">📖</span> Histoires
        </a>
        <a href="#" class="sidebar-link" id="sidebar-settings-link">
          <span class="link-icon">🔑</span> Token GitHub
        </a>

        <div class="sidebar-spacer"></div>

        <div class="sidebar-footer">
          <button class="btn btn-secondary btn-small" id="logout-btn" style="width:100%">Déconnexion</button>
        </div>
      </aside>

      <!-- Main -->
      <div class="app-main">
        <!-- Mobile header -->
        <header class="mobile-header" role="banner">
          <a href="index.html" class="mobile-logo">
            <img src="assets/icon.jpg" alt="" class="mobile-logo-img">
            <span class="mobile-logo-text">Dreaming Stories</span>
          </a>
          <button class="btn btn-ghost btn-small" id="logout-btn-mobile">Déconnexion</button>
        </header>

        <main>
          <div class="page-content">
            <div class="admin-toolbar">
              <h1 class="admin-toolbar-title">
                Histoires
                <span id="stories-count" style="font-size:0.95rem;color:var(--text-dim);font-family:'Inter',sans-serif;font-weight:300;margin-left:6px"></span>
              </h1>
              <div class="admin-toolbar-actions">
                <div id="pat-status-badge"></div>
                <button class="btn btn-secondary btn-small" id="settings-btn">🔑 Token GitHub</button>
                <button class="btn btn-primary" id="new-story-btn">+ Nouvelle histoire</button>
              </div>
            </div>

            <div class="admin-stories" id="admin-stories" role="list">
              <div class="loading" role="status">Chargement…</div>
            </div>
          </div>
        </main>
      </div>

      <!-- Bottom nav (mobile) -->
      <nav class="bottom-nav" role="navigation" aria-label="Navigation mobile">
        <a href="index.html" class="bottom-nav-item">
          <span class="bottom-nav-icon">🌙</span>
          <span>Histoires</span>
        </a>
        <a href="admin.html" class="bottom-nav-item active">
          <span class="bottom-nav-icon">⚙️</span>
          <span>Admin</span>
        </a>
      </nav>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
